:root[data-theme="dark"]{--bg:#1e1426;--card:#2a1d36;--tx:#f5e9ff;--mu:#b9a6cc;--bd:#44325a;--pink:#ff8fc2;--lav:#b9a3ff;--mint:#6fe3c4;--peach:#ffb996;--g1:#4a2742;--g2:#33285a;--s1:#ff8fc2;--s2:#ffb27d;--s3:#ffd166;--s4:#6fe3c4;--s5:#b3a4ff;--warn:#ff8fb1}

#slide h1{grid-column:1/3;font-size:clamp(16px,2.8vw,28px)}#slide .leg{display:none}

<body data-view="app">
<main id="app">
<div class="hero"><div><h1>🎀 Cantilever Bending Test</h1><p>ME/CEE 2140 · Lab 3 (B) · SM1004 Beam Apparatus</p></div>
<div class="btns noprint"><button id="bPrint">🖨️ Print</button><button id="bReport">📝 Student report</button><button id="bSlide">🎞️ Slide</button></div></div>
<p class="const" id="const"></p>
<div class="grid">
<div class="card noprint-ctl">
<label for="L">Working length ℓ (mm)</label><input id="L" type="number" value="600" min="50" max="700" step="any"><div class="chips" id="cL"></div>
<label for="W">Free-end load W (N)</label><input id="W" type="number" value="10" min="0" max="60" step="any"><div class="chips" id="cW"></div>

<script>
/* ---------- core: data from SM1004Data.xlsx + lab equations ---------- */
const D={200:[0,.07,.15,.22,.28,.34],300:[0,.23,.47,.68,.91,1.13],400:[0,.55,1.11,1.64,2.21,2.73],500:[0,1.07,2.13,3.19,4.26,5.33],600:[0,1.83,3.63,5.45,7.28,9.09]};
const WS=[0,2,4,6,8,10],LS=[200,300,400,500,600],B=19,T=6.35,EREF=210;
const I=B/1000*(T/1000)**3/12; /* m^4, Eq.(1) */
const reg=(x,y)=>{const n=x.length,mx=x.reduce((a,c)=>a+c)/n,my=y.reduce((a,c)=>a+c)/n;let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)**2;b+=(x[i]-mx)*(y[i]-my);c+=(y[i]-my)**2}const m=b/a;return{m,c:my-m*mx,r2:b*b/(a*c)}};
const R={};LS.forEach(L=>{const r=reg(WS,D[L]);r.l3=(L/1000)**3;r.E=r.l3*1e9/(3*r.m*I*1e12);R[L]=r}); /* Eq.(4), MPa */
const EM=LS.reduce((a,L)=>a+R[L].E,0)/LS.length;
const Q=reg(LS.map(L=>R[L].l3),LS.map(L=>D[L][5]/1000));Q.E=10/(3*I*Q.m)/1e6; /* Eq.(6), MPa */
const dev=E=>100*Math.abs(E/1000-EREF)/EREF,DM=dev(EM),DQ=dev(Q.E);
const calc=(L,W)=>{if(D[L]){const i=WS.indexOf(W);if(i>=0)return{z:D[L][i],src:"Measured lab data"};return{z:Math.max(0,R[L].m*W+R[L].c),src:"Regression line of measured data"}}
return{z:W*(L/1000)**3/(3*EM*1e6*I)*1000,src:"Equation (2) with mean E"}};
const slopeFor=L=>R[L]?R[L].m:(L/1000)**3/(3*EM*1e6*I)*1000,Efor=L=>R[L]?R[L].E:EM;
const f=(x,d=4)=>{if(!isFinite(x))return"–";const a=Math.abs(x);if(a!==0&&(a<1e-3||a>=1e6))return x.toExponential(2);return String(+x.toPrecision(d))};
</script>
<script>
const $=id=>document.getElementById(id);
const sg=(c,d=3)=>(c<0?" − ":" + ")+f(Math.abs(c),d);
const cols=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)"];

function bar(L,W,z){
 const y0=200,xc=150,ps=520/700,Lp=Math.max(30,Math.min(L,700)*ps),rise=z>0?14+76*(1-Math.exp(-z/5)):0,k=z>0?Math.round(rise/(z*ps)):0;
 const tx=xc+Lp,ty=y0-rise,end=tx>560?"end":"start",o=end==="end"?-14:14;
 let s=`<svg viewBox="0 0 720 300" role="img" aria-label="Cantilever beam, deflected">`;
 s+=`<text class="tm" x="12" y="18">Drawing auto-scaled${k?" (deflection shown about "+k+"× larger)":""}</text>`;
 s+=`<path d="M90 ${y0}V${y0-85}M72 ${y0-85}H108" style="stroke:var(--mu);stroke-width:2;fill:none"/><text class="tm" x="90" y="${y0-93}" text-anchor="middle">string</text>`;
 s+=`<line x1="${xc}" y1="${y0}" x2="${tx}" y2="${y0}" style="stroke:var(--mu);stroke-dasharray:5 5"/><line x1="90" y1="${y0}" x2="${xc}" y2="${y0}" style="stroke:var(--mu);stroke-width:9"/>`;
 const N=40;for(let i=0;i<N;i++){const a=i/N,b=(i+1)/N,yy=x=>y0-rise*(3*x*x-x**3)/2,t=1-(a+b)/2;
  s+=`<line x1="${xc+Lp*a}" y1="${yy(a)}" x2="${xc+Lp*b}" y2="${yy(b)}" stroke="hsl(${170+160*t} 80% 68%)" stroke-width="9"/>`}
 s+=`<rect x="${xc-12}" y="${y0-24}" width="24" height="48" rx="5" style="fill:var(--mu)"/><rect x="${xc-5}" y="${y0+24}" width="10" height="38" style="fill:var(--mu)"/><text class="tm" x="${xc}" y="${y0+78}" text-anchor="middle">clamp</text>`;
 s+=`<rect x="${tx-11}" y="48" width="22" height="40" rx="6" style="fill:var(--lav)"/><circle cx="${tx}" cy="66" r="7" style="fill:var(--card)"/><line x1="${tx}" y1="88" x2="${tx}" y2="${ty-5}" style="stroke:var(--lav);stroke-width:2"/>`;
 s+=`<text class="t tb" x="${tx+o}" y="62" text-anchor="${end}">z = ${f(z,3)} mm</text><text class="tm" x="${tx+o}" y="78" text-anchor="${end}">dial indicator</text>`;
 s+=`<line x1="${tx}" y1="${ty+58}" x2="${tx}" y2="${ty+12}" style="stroke:var(--pink);stroke-width:3"/><path d="M${tx-7} ${ty+18}L${tx+7} ${ty+18}L${tx} ${ty+6}Z" style="fill:var(--pink)"/><rect x="${tx-14}" y="${ty+58}" width="28" height="13" rx="4" style="fill:var(--pink)"/>`;
 s+=`<text class="t tb" x="${tx+o}" y="${ty+42}" text-anchor="${end}">W = ${f(W,3)} N</text>`;
 s+=`<path d="M${xc} 280V290M${tx} 280V290M${xc} 285H${tx}" style="stroke:var(--mu);fill:none"/><text class="t" x="${(xc+tx)/2}" y="279" text-anchor="middle">ℓ = ${f(L,4)} mm</text></svg>`;
 return s}

function chart(o){const w=380,h=270,l=54,r=14,t=12,b=44,pw=w-l-r,ph=h-t-b,X=v=>l+v/o.xm*pw,Y=v=>t+ph-v/o.ym*ph;
 let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.al}">`;
 for(let i=0;i<=5;i++){const a=o.xm*i/5,c=o.ym*i/5;s+=`<line class="gr" x1="${X(a)}" y1="${t}" x2="${X(a)}" y2="${t+ph}"/><line class="gr" x1="${l}" y1="${Y(c)}" x2="${l+pw}" y2="${Y(c)}"/><text class="tk" x="${X(a)}" y="${t+ph+14}" text-anchor="middle">${o.xf(a)}</text><text class="tk" x="${l-6}" y="${Y(c)+4}" text-anchor="end">${o.yf(c)}</text>`}
 s+=`<line class="ax" x1="${l}" y1="${t+ph}" x2="${l+pw}" y2="${t+ph}"/><line class="ax" x1="${l}" y1="${t}" x2="${l}" y2="${t+ph}"/>`;
 o.series.forEach((se,i)=>{let x2=o.xm,y2=se.c+se.m*x2;if(y2>o.ym){x2=(o.ym-se.c)/se.m;y2=o.ym}
  s+=`<line x1="${X(0)}" y1="${Y(se.c)}" x2="${X(x2)}" y2="${Y(y2)}" style="stroke:${cols[i]};stroke-width:1.8"/>`;
  se.pts.forEach(p=>s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.6" style="fill:${cols[i]}"/>`)});
 if(o.hi&&o.hi[0]<=o.xm&&o.hi[1]<=o.ym)s+=`<circle cx="${X(o.hi[0])}" cy="${Y(o.hi[1])}" r="8" style="fill:none;stroke:var(--tx);stroke-width:2"/>`;
 s+=`<text class="al" x="${l+pw/2}" y="${h-6}" text-anchor="middle">${o.xl}</text><text class="al" transform="translate(13 ${t+ph/2}) rotate(-90)" text-anchor="middle">${o.yl}</text></svg>`;return s}

const fig1=hi=>chart({xm:10,ym:10,al:"Deflection versus load",xl:"Load W [N]",yl:"Deflection Z [mm]",xf:v=>v,yf:v=>v,hi,series:LS.map(L=>({pts:WS.map((w,i)=>[w,D[L][i]]),m:R[L].m,c:R[L].c}))});
const fig2=()=>chart({xm:.25,ym:.01,al:"Deflection versus l cubed",xl:"ℓ³ [m³]",yl:"Deflection Z [m]",xf:v=>v.toFixed(2),yf:v=>v.toFixed(3),series:[{pts:LS.map(L=>[R[L].l3,D[L][5]/1000]),m:Q.m,c:Q.c}]});
const leg1=()=>LS.map((L,i)=>`<li><i style="background:${cols[i]}"></i>ℓ = ${L} mm: z = ${f(R[L].m,4)}·W${sg(R[L].c)}, R² = ${f(R[L].r2,5)}</li>`).join("");
const leg2=()=>`<li><i style="background:${cols[0]}"></i>z = ${f(Q.m,4)}·ℓ³${sg(Q.c,2)}, R² = ${f(Q.r2,5)}</li>`;

const tbl=()=>`<table><tr><th>ℓ (mm)</th><th>ℓ³ (m³)</th><th>Slope m (mm/N)</th><th>Intercept (mm)</th><th>R²</th><th>E (MPa)</th></tr>`+LS.map(L=>`<tr><td>${L}</td><td>${f(R[L].l3,4)}</td><td>${f(R[L].m,5)}</td><td>${f(R[L].c,3)}</td><td>${f(R[L].r2,5)}</td><td>${f(R[L].E,6)}</td></tr>`).join("")+
`<tr><td colspan="5"><b>Average E (Figure 1 slopes)</b></td><td><b>${f(EM,6)}</b></td></tr></table>
<p style="font-size:.85em;margin:8px 0 0">Fixed load W = 10 N: I = ${f(I,4)} m⁴, slope q = ${f(Q.m,4)} 1/m², E = <b>${f(Q.E,6)} MPa</b>.<br>
E<sub>ref</sub> = ${EREF} GPa (actual range 190–210 GPa). Deviation of mean E from Figure 1: <b>${f(DM,3)} %</b>. Deviation of E from Figure 2: <b>${f(DQ,3)} %</b>.</p>`;

function upd(){
 const L=+$("L").value,W=+$("W").value;
 [["cL",L],["cW",W]].forEach(([id,v])=>[...$(id).children].forEach(b=>b.classList.toggle("on",+b.textContent===v)));
 if(!(L>=50&&L<=700&&W>=0)){$("stats").innerHTML=`<div class="stat"><span>Check inputs</span><b class="warn">ℓ must be 50–700 mm and W ≥ 0</b></div>`;return}
 const c=calc(L,W),m=slopeFor(L),E=Efor(L),w=[];
 if(c.z>25)w.push("Beyond the 25 mm indicator range");if(W>60)w.push("Beyond the 60 N load-cell range");
 $("stats").innerHTML=[["Free-end deflection z",f(c.z,4)+" mm"],["Value comes from",c.src],["Slope m = z/W",f(m,4)+" mm/N"],["Young’s modulus E (this length)",f(E,6)+" MPa"]].map(a=>`<div class="stat"><span>${a[0]}</span><b>${a[1]}</b></div>`).join("")+(w.length?`<div class="stat"><span>Warning</span><b class="warn">${w.join("; ")}</b></div>`:"");
 $("bar").innerHTML=bar(L,W,c.z);$("f1").innerHTML=fig1([W,c.z]);
}

/* ---------- setup ---------- */
$("const").innerHTML=`Beam: mild steel · b = ${B} mm · d = ${T} mm · I = ${f(I,4)} m⁴ · E<sub>ref</sub> = ${EREF} GPa (190–210 GPa)`;
const mk=(id,arr,inp)=>arr.forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v;b.onclick=()=>{$(inp).value=v;upd()};$(id).appendChild(b)});
mk("cL",LS,"L");mk("cW",WS,"W");
$("f2").innerHTML=fig2();$("l1").innerHTML=leg1();$("l2").innerHTML=leg2();$("tbl").innerHTML=tbl();
["L","W"].forEach(i=>$(i).addEventListener("input",upd));upd();

/* ---------- buttons ---------- */
const view=v=>{document.body.dataset.view=v;window.scrollTo(0,0)};
$("bPrint").onclick=()=>window.print();
document.querySelectorAll(".back").forEach(b=>b.onclick=()=>view("app"));
document.querySelectorAll(".pr").forEach(b=>b.onclick=()=>window.print());

$("bReport").onclick=()=>{
 const L=+$("L").value,W=+$("W").value,c=calc(L,W),r6=R[600],r3=R[300],inR=EM/1000>=190&&EM/1000<=210;
 const raw=`<table><tr><th>W (N)</th>${LS.map(l=>`<th>z at ${l} mm</th>`).join("")}</tr>`+WS.map((w,i)=>`<tr><td>${w}</td>${LS.map(l=>`<td>${D[l][i]}</td>`).join("")}</tr>`).join("")+`</table>`;
 $("report").innerHTML=`<h1>Bending Test of Cantilevers – Data and Results</h1>
<p>ME/CEE 2140 · Lab 3 (B) · SM1004 Beam Apparatus &nbsp;|&nbsp; Name: <span contenteditable>&nbsp;</span> ID: <span contenteditable>&nbsp;</span> Section: <span contenteditable>&nbsp;</span> Date: <span contenteditable>${new Date().toLocaleDateString()}</span></p>
<h2>Setup</h2><p>A mild-steel strip (b = ${B} mm, d = ${T} mm, I = bd³/12 = ${f(I,4)} m⁴) was clamped as a cantilever. A load cell applied W = 0–10 N at the free end, and a dial indicator at the same point measured z. Working lengths were 200, 300, 400, 500 and 600 mm.</p>
<h2>Measured deflection z (mm)</h2>${raw}
<h2>Regression summary (z vs W)</h2>${tbl()}
<h2>Representative calculations</h2>
<p>I = (0.019)(0.00635)³/12 = ${f(I,4)} m⁴ &nbsp;|&nbsp; E (ℓ = 600 mm) = ℓ³/(3Im) = (0.216)/(3·${f(I,4)}·${f(R[600].m/1000,5)}) = ${f(R[600].E,6)} MPa</p>
<p>E (z–ℓ³) = W/(3Iq) = 10/(3·${f(I,4)}·${f(Q.m,4)}) = ${f(Q.E,6)} MPa &nbsp;|&nbsp; % deviation = 100·|E − E<sub>ref</sub>|/E<sub>ref</sub> = ${f(DQ,3)} %</p>
